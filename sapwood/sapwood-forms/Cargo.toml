[package]
name = "sapwood-forms"
description = "HTML forms for Axum: CSRF-checked extractors for plain, typed and file-upload forms, and validation errors to show next to the fields."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["forms", "csrf", "validation", "axum", "multipart"]
categories = ["web-programming::http-server"]
readme = "README.md"

[dependencies]
sapwood-session = { version = "0.1.0", path = "../sapwood-session" }
axum = { version = "0.8", default-features = false, features = ["multipart"] }
form_urlencoded = "1"
serde = { version = "1", features = ["derive"] }
serde_html_form = "0.2"
tracing = "0.1"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["multipart", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
