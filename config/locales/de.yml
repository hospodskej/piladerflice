    firewood:
      breadcrumb_category: "Brennholz"
      stock_status: "Auf Lager"
      loose_heading_html: "<span class=\"text-blue\">Lose geschüttetes</span> Brennholz"
      stacked_heading_html: "<span class=\"text-blue\">Gestapeltes</span> Brennholz in Kisten"
      species:
        smrk:
          subtitle: "Weiches Brennholz"
          description: "Leichtes Fichtenholz, ideal für schnelles Aufheizen von Kaminen und Öfen, fängt leicht Feuer. Heizwert ca. 1500–1700 kWh/m³, brennt 1–2 Stunden."
          image_alt: "Fichte Brennholz"
          drying_note: "Empfohlene Trocknungszeit 6–12 Monate an einem trockenen, gut belüfteten Ort."
        dub:
          subtitle: "Hartes Brennholz"
          description: "Eichenholz mit hohem Heizwert und langer Brenndauer, ideal für Kamine und Öfen. Heizwert ca. 2100–2300 kWh/m³, brennt 3–4 Stunden."
          image_alt: "Eiche Brennholz"
          drying_note: "Empfohlene Trocknungszeit 1–2 Jahre an einem gut belüfteten Ort."
        buk:
          subtitle: "Hartes Brennholz"
          description: "Buchenholz mit hohem Heizwert und gleichmäßigem Abbrand, ideal für langanhaltendes Heizen. Heizwert ca. 2100–2200 kWh/m³, brennt 2–3 Stunden."
          image_alt: "Buche Brennholz"
          drying_note: "Empfohlene Trocknungszeit 1–2 Jahre."
        akat:
          subtitle: "Hartes Brennholz"
          description: "Beliebt für gleichmäßigen Abbrand, minimale Rauchentwicklung und einen feinen Duft. Bestens geeignet zum Heizen in Kaminen und Öfen. Heizwert ca. 2200–2500 kWh/m³, brennt 3–4 Stunden."
          image_alt: "Akazie Brennholz"
          drying_note: "Empfohlene Trocknungszeit 1–2 Jahre."
        jasan:
          subtitle: "Hartes Brennholz"
          description: "Eschenholz sorgt für einen stabilen Abbrand und intensive Wärme, geeignet für Kamine und Öfen. Heizwert ca. 1900–2100 kWh/m³, brennt 2–3 Stunden."
          image_alt: "Esche Brennholz"
          drying_note: "Empfohlene Trocknungszeit 1–2 Jahre."
        briza:
          subtitle: "Hartes Brennholz"
          description: "Beliebt für gleichmäßigen Abbrand, minimale Rauchentwicklung und einen feinen Duft. Bestens geeignet zum Heizen in Kaminen und Öfen. Heizwert ca. 1900–2100 kWh/m³, brennt 2–3 Stunden."
          image_alt: "Birke Brennholz"
          drying_note: "Empfohlene Trocknungszeit 1–2 Jahre."
        habr:
          subtitle: "Hartes Brennholz"
          description: "Hainbuche gehört zu den heizwertstärksten Hölzern und liefert lang anhaltende, intensive Wärme. Heizwert ca. 2300–2500 kWh/m³, brennt 3–4 Stunden."
          image_alt: "Hainbuche Brennholz"
          drying_note: "Empfohlene Trocknungszeit 1–2 Jahre."

    tramy:
      breadcrumb_category: "Bauschnittholz"
      description: "Massive Holzbalken für Dachstühle, Decken und tragende Bauteile. Aus hochwertigem Holz mit langer Lebensdauer gefertigt."
      stock_status: "Auf Lager"
      loose_heading_html: "<span class=\"text-blue\">Lose geschüttete</span> Balken"
    late:
      breadcrumb_category: "Bauschnittholz"
      description: "Bauholzlatten geeignet für Dachkonstruktionen, Roste und weitere Bauanwendungen. Aus hochwertigem Holz, erhältlich in verschiedenen Längen und Querschnitten. Ideal für präzise und zuverlässige Konstruktionen."
      stock_status: "Auf Lager"
      loose_heading_html: "<span class=\"text-blue\">Lose geschüttete</span> Dachlatten"
    fosny:
      breadcrumb_category: "Bauschnittholz"
      description: "Robuste Bohlen ideal für die Herstellung von Böden, Schalungen oder Konstruktionselementen. Erhältlich in einer großen Auswahl an Maßen und Stärken. Hochwertiges Holz sorgt für Festigkeit und Beständigkeit."
      stock_status: "Auf Lager"
      loose_heading_html: "<span class=\"text-blue\">Lose geschüttete</span> Bohlen"
    prkna:
      breadcrumb_category: "Bauschnittholz"
      title: "Bretter, 24 mm"
      description: "Hochwertige Bauschnittbretter geeignet für Schalungen, Böden und weitere Bauanwendungen."
      stock_status: "Auf Lager"
      loose_heading_html: "<span class=\"text-blue\">Lose geschüttete</span> Bretter"
      quality_grades:
        netridene_1: "I. unsortiert"
        tridene_1: "I. sortiert"
        tridene_2: "II. sortiert"

    odkory:
      breadcrumb_category: "Produktionsreste"
      description: "Günstiger und effizienter Brennstoff aus entrindeten Holzstücken. Geeignet für Öfen, Kamine und Heizkessel. Bietet hohen Heizwert bei minimalen Kosten. Erhältlich lose oder verpackt nach Kundenwunsch."
      item_label: "Rindenreste"
    piliny:
      breadcrumb_category: "Produktionsreste"
      description: "Hochwertiges Sägemehl geeignet als Einstreu, zum Mulchen oder zum Pressen von Briketts. Niedrige Feuchtigkeit und feine Struktur sorgen für einfache Handhabung. Erhältlich lose oder verpackt."
      item_label: "Sägemehl"
    stepka:
      breadcrumb_category: "Produktionsreste"
      description: "Holzhackschnitzel, ideal als umweltfreundlicher Brennstoff oder Mulchmaterial für den Garten. Aus hochwertigem Holz hergestellt, niedrige Feuchtigkeit sorgt für hohen Heizwert. Erhältlich lose oder verpackt."
      item_label: "Hackschnitzel"
    okrasne_kamenivo_detail:
      breadcrumb_category: "Ziersteine"
      description: "Natürliche Ziersteine für die Gartengestaltung, Flächenschüttungen und dekorative Zwecke. Erhältlich in drei Körnungen."
