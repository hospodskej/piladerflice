  legal:
    terms_title: "Allgemeine Geschäftsbedingungen"
    terms_placeholder: "Die Allgemeinen Geschäftsbedingungen werden in Kürze veröffentlicht."
    terms_content_html: |
      <h2>1. Einleitende Bestimmungen</h2>
      <p>Diese Allgemeinen Geschäftsbedingungen (im Folgenden „AGB") regeln die gegenseitigen Rechte und Pflichten der Vertragsparteien im Zusammenhang mit einem Kaufvertrag, der abgeschlossen wird zwischen:</p>
      <p><strong>Štěpán Merta</strong><br>
      Pila Derflice<br>
      Geschäftssitz: Derflice 66, 671 28 Znojmo, Tschechische Republik<br>
      Korrespondenz- und Rechnungsadresse: Meruňková 206, 671 81 Nový Šaldorf – Sedlešovice<br>
      Steuernummer (IČ): 45665451<br>
      USt-IdNr. (DIČ): CZ6909094742<br>
      Natürliche Person, die gemäß dem tschechischen Gewerbegesetz unternehmerisch tätig ist und nicht im Handelsregister eingetragen ist.<br>
      E-Mail: stepan.merta@seznam.cz<br>
      Telefon: +420 602 446 339, +420 515 235 527<br>
      Geschäftszeiten: Montag – Freitag, 7:00 – 15:30 Uhr</p>
      <p>(im Folgenden „Verkäufer") und dem Käufer, der über den Onlineshop unter piladerflice.cz eine Warenbestellung tätigt (im Folgenden „Käufer").</p>
      <p>Der Verkäufer kann den Wortlaut der AGB ändern oder ergänzen. Rechte und Pflichten, die während der Gültigkeit der vorherigen Fassung der AGB entstanden sind, bleiben davon unberührt.</p>

      <h2>2. Zustandekommen des Kaufvertrags</h2>
      <p>Der Käufer sendet die Bestellung über das Bestellformular im Onlineshop ab. Mit dem Absenden der Bestellung bestätigt der Käufer, dass er diese AGB zur Kenntnis genommen hat und ihnen zustimmt.</p>
      <p>Der Kaufvertrag zwischen dem Verkäufer und dem Käufer kommt in dem Moment zustande, in dem die Bestellbestätigung des Verkäufers an die E-Mail-Adresse des Käufers zugestellt wird.</p>

      <h2>3. Preise und Zahlungsbedingungen</h2>
      <p>Die im Onlineshop angegebenen Warenpreise gelten zum Zeitpunkt der Bestellabsendung und verstehen sich inklusive Mehrwertsteuer.</p>
      <p>Die Zahlung kann auf eine der folgenden Arten erfolgen:</p>
      <ul>
        <li><strong>Bar bei persönlicher Abholung</strong> – am Betriebssitz Derflice 66, 671 28 Znojmo.</li>
        <li><strong>Per Banküberweisung</strong> – auf Grundlage einer Proforma-Rechnung, die dem Käufer nach Eingang der Bestellung zugesandt wird; der Versand erfolgt nach Zahlungseingang auf dem Konto des Verkäufers.</li>
      </ul>
      <p>Der Verkäufer bietet derzeit keine Online-Kartenzahlung an.</p>

      <h2>4. Lieferbedingungen</h2>
      <p>Der Käufer kann zwischen folgenden Versandarten wählen:</p>
      <ul>
        <li><strong>Persönliche Abholung</strong> – kostenlos, am Betriebssitz Derflice 66, 671 28 Znojmo, nach vorheriger Vereinbarung.</li>
        <li><strong>Lieferung an die Adresse</strong> – der Lieferpreis richtet sich nach Entfernung und bestellter Menge (aktuell 35 CZK/km) und wird dem Käufer nach Eingang der Bestellung individuell mitgeteilt. Der Verkäufer liefert insbesondere in Südmähren und im angrenzenden Österreich.</li>
      </ul>
      <p>Der Liefer- bzw. Abholtermin wird individuell je nach Warenverfügbarkeit und Kapazität des Verkäufers vereinbart; sofern nichts anderes vereinbart wurde, liefert der Verkäufer die Ware innerhalb einer angemessenen Frist.</p>

      <h2>5. Widerrufsrecht</h2>
      <p>Gemäß § 1829 des tschechischen Bürgerlichen Gesetzbuchs hat der Käufer, sofern er Verbraucher ist, das Recht, innerhalb von 14 Tagen ab Erhalt der Ware ohne Angabe von Gründen vom im Fernabsatz geschlossenen Kaufvertrag zurückzutreten, indem er dem Verkäufer eine schriftliche Widerrufserklärung per E-Mail oder Post zusendet.</p>
      <p>Gemäß § 1837 lit. d) des Bürgerlichen Gesetzbuchs besteht kein Widerrufsrecht bei Waren, die nach den Wünschen des Käufers angefertigt wurden (z. B. nach individuellen Maßen zugeschnittenes Bau- oder Schnittholz).</p>
      <p>Der Käufer hat die Ware unbeschädigt und, soweit es die Art der Ware zulässt, ohne Gebrauchsspuren innerhalb von 14 Tagen ab Widerruf zurückzusenden. Die Kosten der Rücksendung trägt der Käufer.</p>

      <h2>6. Gewährleistung und Reklamation</h2>
      <p>Die Rechte und Pflichten der Vertragsparteien hinsichtlich der Mängelhaftung richten sich nach den einschlägigen Bestimmungen des tschechischen Bürgerlichen Gesetzbuchs, insbesondere §§ 2099 ff. und §§ 2158 ff.</p>
      <p>Ist der Käufer Verbraucher, haftet der Verkäufer dafür, dass die Ware bei Übergabe keine Mängel aufweist, und zwar für einen Zeitraum von 24 Monaten ab Übergabe.</p>
      <p>Reklamationen können per E-Mail an stepan.merta@seznam.cz oder persönlich am Betriebssitz geltend gemacht werden. Der Verkäufer entscheidet über die Reklamation und erledigt sie spätestens innerhalb von 30 Tagen ab Geltendmachung, sofern mit dem Käufer keine längere Frist vereinbart wurde.</p>
      <p>Aufgrund der Beschaffenheit der Ware (Naturmaterial Holz) gelten geringfügige Unterschiede in Maserung, Farbe oder leichte Maßabweichungen, die auf die natürlichen Eigenschaften des Holzes zurückzuführen sind, nicht als Mangel, sofern sie die übliche Verwendung der Ware nicht beeinträchtigen.</p>

      <h2>7. Datenschutz</h2>
      <p>Der Verkäufer verarbeitet personenbezogene Daten des Käufers (Name, Adresse, Telefonnummer, E-Mail, ggf. Steuernummer/USt-IdNr. bei Firmenkäufen) ausschließlich zum Zweck der Bestellabwicklung, der Erfüllung des Kaufvertrags sowie der Erfüllung gesetzlicher Pflichten (z. B. Buchhaltung). Verantwortlicher für die Datenverarbeitung ist Štěpán Merta, IČ: 45665451.</p>
      <p>Die Daten werden nicht an Dritte weitergegeben, mit Ausnahme der für die Zustellung notwendigen Personen (Transportunternehmen) sowie gesetzlich vorgeschriebener Stellen (z. B. Finanzbehörden).</p>
      <p>Der Käufer hat das Recht auf Auskunft über seine personenbezogenen Daten, deren Berichtigung oder Löschung sowie auf Einschränkung der Verarbeitung, das Recht, der Verarbeitung zu widersprechen, sowie das Recht, Beschwerde bei der zuständigen Datenschutzbehörde einzureichen.</p>

      <h2>8. Außergerichtliche Streitbeilegung</h2>
      <p>Kommt es zwischen dem Verkäufer und einem Käufer, der Verbraucher ist, zu einem Verbraucherstreit, hat der Käufer das Recht auf dessen außergerichtliche Beilegung. Zuständige Stelle ist die tschechische Handelsinspektion (Česká obchodní inspekce), Zentralinspektorat – Abteilung ADR, mit Sitz in Štěpánská 567/15, 120 00 Prag 2, Internetadresse: <a href="https://adr.coi.cz" target="_blank" rel="noopener">adr.coi.cz</a>.</p>

      <h2>9. Schlussbestimmungen</h2>
      <p>Diese AGB unterliegen dem Recht der Tschechischen Republik, insbesondere dem Gesetz Nr. 89/2012 Slg., Bürgerliches Gesetzbuch, sowie dem Gesetz Nr. 634/1992 Slg., über den Verbraucherschutz, in der jeweils geltenden Fassung.</p>
      <p>Sollte eine Bestimmung dieser AGB unwirksam sein oder werden, tritt an ihre Stelle eine Regelung, die dem wirtschaftlichen Zweck der unwirksamen Bestimmung am nächsten kommt. Die Unwirksamkeit einer Bestimmung berührt nicht die Gültigkeit der übrigen Bestimmungen.</p>
      <p>Diese AGB treten mit dem Datum ihrer Veröffentlichung in Kraft.</p>

    cookies_title: "Cookie-Richtlinie"
    cookies_content_html: |
      <p>Diese Website verwendet Cookies – kleine Textdateien, die in Ihrem Browser gespeichert werden und uns helfen, ihre korrekte Funktion sicherzustellen.</p>

      <h2>1. Notwendige Cookies</h2>
      <p>Diese Cookies sind für die grundlegende Funktion der Website erforderlich (z. B. Warenkorb-Inhalt, gespeicherte Sprache und Währung, Anmeldung im Verwaltungsbereich) und können nicht deaktiviert werden. Ohne sie würde die Website nicht ordnungsgemäß funktionieren.</p>

      <h2>2. Analyse-Cookies</h2>
      <p>Zur Besuchermessung verwenden wir Google Analytics (Google Ireland Limited). Diese Cookies werden nur gesetzt, wenn Sie dem über „Alle akzeptieren" zustimmen. Sie helfen uns zu verstehen, wie Besucher die Website nutzen, um sie entsprechend zu verbessern.</p>
      <p>Derzeit verwenden wir keine Marketing- oder Werbe-Cookies.</p>

      <h2>3. Verwaltung der Zustimmung</h2>
      <p>Sie können Ihre Auswahl jederzeit über den Link „Cookie-Einstellungen" in der Fußzeile ändern.</p>

