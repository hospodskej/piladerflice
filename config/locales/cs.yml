        dub:
          title: "Tvrdé palivové dřevo"
          desc: "Dub, 33cm"
          price: "1800 KČ / 1 PRMS"
      btn_prohlednout: "PROHLÉDNOUT"
      nabidka_title_accent: "nabídnout?"
      nabidka_title_rest: "Co vám můžeme"
      nabidka_text_1_html: "Pokud topíte dřevem a sháníte kvalitní otop do krbu či na zátop? Potřebujete stavební dřevo k rekonstrukci či stavbě altánů, plotů či dřevostaveb? Vyrábíte nábytek z <strong>kvalitního řeziva</strong>, pak se na nás nebojte obrátit."
      nabidka_text_2_html: "Za tu dobu nabízíme <strong>široký sortiment</strong> dřevěných materiálů, včetně prken, latí, trámů a fošen. Pro zahradní úpravy máme okrasné kamenivo, a pro další využití také piliny, hobliny a štěpku."
      sluzby_title_accent: "poskytujeme?"
      sluzby_title_rest: "Jaké služby"
      dorucujeme_title_accent: "doručujeme?"
      dorucujeme_title_rest: "Kam všude"
      dorucujeme_text_1: "Palivové dřevo rozvážíme po celé jižní Moravě i severním Rakousku, a to včetně hraničních oblastí mezi Vysočinou a středním Rakouskem. Patří sem například města a obce jako Slavonice, Vratěnín, Jemnice, Dačice, Znojmo, na rakouské straně pak například Drosendorf, Raabs an der Thaya, Hardegg či Thaya."
      dorucujeme_text_2: "Cena dopravy se vždy odvíjí od vzdálenosti a množství objednaného dřeva, aby byla co nejvýhodnější pro každého zákazníka."
      dorucujeme_map_alt: "Mapa doručení po jížní Moravě a Rakousku"
      zajimat_title_accent: "zajímat?"
      zajimat_title_rest: "Co by Vás mohlo"
      o_sobe_title_accent: "o sobě řekli?"
      o_sobe_title_rest: "Co bychom"
      o_sobe_image_alt: "Nakládání dřeva v lese"
      o_sobe_p1_html: "Naše pila, vedená panem Štěpánem Mertou, působí v oboru zpracování dřeva již <strong>přes 30 let.</strong>"
      o_sobe_p2_html: "Díky dlouholeté praxi a zkušenostem jsme schopni <strong>vyhovět specifickým požadavkům</strong> našich zákazníků."
      o_sobe_p3_html: "Disponujeme <strong>moderním vybavením</strong>, včetně automatické štípačky, pásové pily, hoblovačky, impregnační vany apod."
      o_sobe_p4: "Zajišťujeme dopravu výrobků přímo k vám domů."
      o_sobe_p5_html: "I přes menší tým čítající přibližně 10 zaměstnanců si zakládáme na <strong>dodržování termínů</strong> a <strong>poskytování vysoké kvality služeb.</strong>"
      o_sobe_cta: "Poptávka"

