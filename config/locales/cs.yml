  sortiment:
    index:
      title: "Sortiment"
    palivove_drevo:
      title: "Palivové dřevo"
      desc_1: "Palivové dřevo běžně prodáváme nařezané na 25, 33 cm, 1 m, až 4 m a dál., naštípané a sypané volně v kontejneru, které dovezeme až na vámi zvolené místo. Prodejní jednotka je 1 PRM (prostorový metr)."
      desc_2: "Momentálně nabízíme dřevo z tvrdých listnatých stromů, které jsou buk, dub, habr, akát, jasan, bříza a z měkkých jehličnatých je v nabídce smrk, borovice, modřín."
    stavebni_rezivo:
      tramy:
        title: "Trámy"
        desc_1: "Standardní stavební materiál nejčastěji používaný jako dřevěné krovy a konstrukce střešních vazeb pro stavbu pergol a jiné. Hranoly vyrábíme na míru dle zákazníka."
        desc_2: "Maximální řezaná délka je 11m a pila snese maximální šířku kmene 110. Stavební řezivo vyrábíme ze smrku, borovice a modřínu."
      prkna:
        title: "Prkna"
        desc_1: "Stavební materiál používán k výrobě stropů, podlah, střech, obkladů stěn, pomocné stavební konstrukce a jiné."
        desc_2: "Prkna vyrábíme ze smrku, dubu borovice, modřínu atd. Maximální řezaná délka je 11m."
      late:
        title: "Latě"
        desc_1: "Standardní stavební materiál nejčastěji používaný jako dřevěné krovy a konstrukce střešních vazeb pro stavbu pergol a jiné. Hranoly vyrábíme na míru podle zákazníka."
        desc_2: "Maximální řezaná délka je 11m a pila snese maximální šířku kmene 110. Stavební řezivo vyrábíme ze smrku, borovice, modřínu."
      fosny:
        title: "Fošny"
        desc_1: "Standardní stavební materiál, který je možno použít pro výrobu nosných konstrukcí (střešní konstrukce, pergoly, terasy apod.)"
        desc_2: "Maximální řezaná délka je 11m. Stavební řezivo vyrábíme ze smrku, dubu, modřínu, borovice atd."
    truhlarske_rezivo:
      fosny:
        title: "Fošny"
        desc_1: "Truhlářské řezivo je základní surovinou pro výrobu spárovky, která se dále používá k výrobě nábytku z masivu, jako jsou např. skříně, stoly, židle, postele, dveře, okna, schody, hudební nástroje a tak dále."
    okrasne_kamenivo:
      title: "Valouny a oblázky"
      desc_1: "Dekorativní kamenivo ideální pro zahrady, chodníky, jezírka a okrasné záhony"
      desc_2: "K dispozici v různých frakcích a barevných variantách, vhodné pro designové úpravy i praktické využití"
      desc_3: "Nabízíme balení v pytlích nebo volně ložené dle požadavků zákazníka."
      desc_4: "Cena od 1kč za 1kg."
    vyrobni_zbytky:
      odkory:
        title: "Odkory"
        desc_1: "Kvalitní dřevěné odkory vznikající při výrobě, vhodné pro další dílenské využití, topení nebo drobné truhlářské práce. Každá šarže obsahuje směs různých rozměrů a tvarů."
      stepka:
        title: "Štěpka"
        desc_1: "Čistá dřevní štěpka bez příměsí, ideální pro energetické využití, mulčování nebo výrobu dřevotřískových materiálů. Vyznačuje se stabilní frakcí a rovnoměrnou strukturou."
      piliny:
        title: "Piliny"
        desc_1: "Jemné suché piliny vhodné pro pelety, brikety, stelivo nebo další průmyslové zpracování. Vznikají při řezání a broušení masivního dřeva a mají výbornou sypkost."

