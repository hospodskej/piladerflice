default: &default
  store_options:
    # Sessions live in the cache too: a cart or login unused for 30 days is dropped.
    max_age: <%= 30.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  database: cache
  <<: *default
