      nabidka_title_accent: "anbieten?"
      nabidka_title_rest: "Was können wir Ihnen"
      nabidka_text_1_html: "Heizen Sie mit Holz und suchen hochwertigen Brennstoff für Kamin oder Ofen? Benötigen Sie Bauholz für die Renovierung oder den Bau von Pergolen, Zäunen oder Holzhäusern? Fertigen Sie Möbel aus <strong>hochwertigem Schnittholz</strong>, dann wenden Sie sich vertrauensvoll an uns."
      nabidka_text_2_html: "Wir bieten seit Langem ein <strong>breites Sortiment</strong> an Holzmaterialien, darunter Bretter, Latten, Balken und Bohlen. Für die Gartengestaltung führen wir Ziersteine, und für weitere Verwendungszwecke auch Sägemehl, Hobelspäne und Hackschnitzel."
      sluzby_title_accent: "bieten wir an?"
      sluzby_title_rest: "Welche Dienstleistungen"
      dorucujeme_title_accent: "liefern wir?"
      dorucujeme_title_rest: "Wohin überall"
      dorucujeme_text_1: "Wir liefern Brennholz in ganz Südmähren und Nordösterreich, einschließlich der Grenzregionen zwischen der Region Vysočina und Mittelösterreich. Dazu zählen zum Beispiel Städte und Gemeinden wie Slavonice, Vratěnín, Jemnice, Dačice, Znojmo, auf österreichischer Seite etwa Drosendorf, Raabs an der Thaya, Hardegg oder Thaya."
      dorucujeme_text_2: "Der Lieferpreis richtet sich immer nach Entfernung und bestellter Holzmenge, damit er für jeden Kunden möglichst günstig ist."
      dorucujeme_map_alt: "Liefergebiet in Südmähren und Österreich"
      dorucujeme_pin_label: "Pila Derflice"
      dorucujeme_pin_address: "Derflice 66, 671 28 Znojmo"
      co_je_noveho_title_accent: "neu?"
      co_je_noveho_title_rest: "Was ist"
      co_je_noveho_subtitle: "Brennholz in Kisten"
      co_je_noveho_text: "Bereiten Sie sich rechtzeitig auf die Heizsaison vor! Wir bieten hochwertiges, trockenes Brennholz in praktischen Kisten mit einem Volumen von 1 m³ und Lieferung direkt zu Ihnen nach Hause. Sparen Sie Zeit und Mühe – bestellen Sie einfach, um den Rest kümmern wir uns."
      co_je_noveho_pic1_alt: "Kisten mit Brennholz"
      co_je_noveho_pic2_alt: "Gestapeltes Brennholz in einer Kiste"
      co_je_noveho_pic3_alt: "Brennholz bereit zum Versand"
      zajimat_title_accent: "interessieren?"
      zajimat_title_rest: "Was könnte Sie noch"
      faq_title_rest: "Von Ihnen am häufigsten"
      faq_title_accent: "gestellte Fragen"
      faq_cat_palivove: "Brennholz"
      faq_cat_stavebni: "Bau- und Tischlerschnittholz"
      faq_cat_doprava: "Lieferung"
      faq_palivove_q1: "Was ist der Unterschied zwischen Hart- und Weichholz?"
      faq_palivove_a1: "Hartholz (z. B. Buche, Eiche, Hainbuche, Akazie, Esche oder Birke) hat einen höheren Brennwert und brennt länger, weshalb es sich für langes Heizen eignet. Weichholz (Fichte, Kiefer, Lärche) brennt schneller und lässt sich leichter entzünden, ideal zum Anzünden und schnellen Aufheizen."
      faq_palivove_q2: "Wie lagert man Brennholz richtig?"
      faq_palivove_a2: "Lagern Sie Brennholz an einem trockenen, gut belüfteten Ort, idealerweise auf Paletten oder Unterlagen, damit es nicht direkt mit dem Boden in Berührung kommt. Decken Sie die Oberseite ab, lassen Sie die Seiten aber offen, damit Feuchtigkeit entweichen kann. Richtig gelagertes Holz ist in der Regel nach 1–2 Jahren Trocknung heizbereit."
      faq_palivove_q3: "Was ist der Unterschied zwischen PRMs (geschüttet) und PRMr (geschichtet) Raummeter?"
      faq_palivove_a3: "PRMs (geschütteter Raummeter) bezeichnet lose geschüttetes Holz mit mehr Luftzwischenräumen. PRMr (geschichteter Raummeter) ist sorgfältig gestapeltes Holz, das durch kleinere Zwischenräume mehr tatsächliches Holz pro Volumen enthält."
      faq_palivove_q4: "Ist das Holz sofort zum Heizen bereit?"
      faq_palivove_a4: "Wir bieten getrocknetes Brennholz mit niedriger Feuchtigkeit an, das heizbereit ist. Den genauen Feuchtigkeitsgehalt und Zustand des Holzes teilen wir Ihnen bei der Bestellung gerne mit."
      faq_stavebni_q1: "Welche Schnittholzarten bieten Sie an?"
      faq_stavebni_a1: "Im Angebot finden Sie Balken, Latten, Bohlen und Bretter in Baustandard sowie gehobeltes Schnittholz für Tischler und Möbelbau. Aktuelle Maße und Preise finden Sie in unserem Onlineshop."
      faq_stavebni_q2: "Fertigen Sie Schnittholz nach Dachstuhl-Zuschnittliste an?"
      faq_stavebni_a2: "Ja, anhand der von Ihnen übermittelten Zuschnittliste (Maße und Längen der einzelnen Bauteile) fertigen wir das Schnittholz passgenau an. Die Liste können Sie uns über das Kontaktformular oder direkt per E-Mail zusenden."
      faq_stavebni_q3: "Ist das Schnittholz imprägniert?"
      faq_stavebni_a3: "Wir bieten sowohl unbehandeltes als auch imprägniertes Schnittholz an (Schutz vor holzzerstörenden Insekten, Pilzen und Schimmel), was wir besonders für Dachlatten und tragende Konstruktionen empfehlen."
      faq_stavebni_q4: "Fertigen Sie auch untypische Maße für Balken und Bohlen auf Bestellung?"
      faq_stavebni_a4: "Ja, neben Standardmaßen fertigen wir Balken und Bohlen auch nach Ihren individuellen Anforderungen. Geben Sie einfach das gewünschte Maß und die Menge über das Anfrageformular im Bereich Kontakt an, und wir erstellen Ihnen ein Angebot."
      faq_doprava_q1: "Wie läuft die Lieferung ab?"
      faq_doprava_a1: "Wir liefern das Holz mit eigenen Fahrzeugen direkt zu Ihnen nach Hause oder auf die Baustelle. Der Lieferpreis richtet sich nach Entfernung und bestellter Menge, damit er für Sie möglichst günstig ist."
      faq_doprava_q2: "Wie hoch ist die Mindestmenge für eine Bestellung mit Lieferung?"
      faq_doprava_a2: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua."
      faq_doprava_q3: "Wie lange dauert es, bis das Holz ankommt?"
