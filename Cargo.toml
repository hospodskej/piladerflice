[workspace]
members = [".", "sapwood/*"]
resolver = "3"

# Shared by the sapwood crates (the framework under sapwood/).
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[package]
name = "piladerflice"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
sapwood-i18n = { path = "sapwood/sapwood-i18n" }
sapwood-assets = { path = "sapwood/sapwood-assets" }
sapwood-session = { path = "sapwood/sapwood-session" }
sapwood-forms = { path = "sapwood/sapwood-forms" }
dotenvy = "0.15"
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip"] }
minijinja = { version = "2", features = ["loader", "json"] }
minijinja-autoreload = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rand = "0.9"
form_urlencoded = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "macros", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
regex = "1"
ammonia = "4"
deunicode = "1"
base64 = "0.22"
bcrypt = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
webp = "0.3"
md-5 = "0.10"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }

[dev-dependencies]
http-body-util = "0.1"

# Fingerprinting the images (sapwood-assets) is hashing-heavy; keep it fast
# in debug builds too.
[profile.dev.package.sha1]
opt-level = 3

# The server build: no debug symbols, whole-program optimisation (smaller
# and a little faster; the build takes longer).
[profile.release]
strip = true
lto = true
codegen-units = 1
