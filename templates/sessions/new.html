{% extends "layouts/application.html" %}
{% block content %}
<main class="main">
  <section class="auth-section">
    <div class="auth-box">
      <h1 class="auth-box-title">{{ t("auth.login_title") }}</h1>
      <div class="auth-box-body">
        <form class="auth-form" action="{{ path('/prihlaseni') }}" accept-charset="UTF-8" method="post"><input type="hidden" name="authenticity_token" value="{{ csrf_token }}">
          <div class="form-group">
            <label for="email_address">{{ t("kontakt.form_email") }}</label>
            <input type="email" name="email_address" id="email_address" required autofocus>
          </div>
          <div class="form-group">
            <label for="password">{{ t("auth.password") }}</label>
            <input type="password" name="password" id="password" required>
          </div>
          <input type="submit" name="commit" value="{{ t('auth.login_submit') }}" class="btn-primary auth-submit" data-disable-with="{{ t('auth.login_submit') }}">
</form>
        <p class="auth-switch">
          {{ t("auth.no_account") }} <a href="{{ path('/registrace') }}">{{ t("auth.register_link") }}</a>
        </p>
      </div>
    </div>
  </section>
</main>
{% endblock %}
