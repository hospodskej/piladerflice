[package]
name = "piladerflice"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip"] }
minijinja = { version = "2", features = ["loader", "json"] }
minijinja-autoreload = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha1 = "0.10"
hex = "0.4"
mime_guess = "2"
rand = "0.9"
form_urlencoded = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "macros", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
regex = "1"
ammonia = "4"
deunicode = "1"

[dev-dependencies]
http-body-util = "0.1"

# Fingerprinting the images is hashing-heavy; keep it fast in debug builds too.
[profile.dev.package.sha1]
opt-level = 3
