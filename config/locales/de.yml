  sortiment:
    index:
      title: "Sortiment"
    palivove_drevo:
      title: "Brennholz"
      desc_1: "Brennholz verkaufen wir üblicherweise geschnitten auf 25, 33 cm, 1 m bis 4 m und länger, gespalten und lose in einem Container geschüttet, den wir bis zum gewünschten Ort liefern. Die Verkaufseinheit ist 1 Rm (Raummeter)."
      desc_2: "Aktuell bieten wir Holz von harten Laubbäumen wie Buche, Eiche, Hainbuche, Akazie, Esche, Birke sowie von weichen Nadelbäumen wie Fichte, Kiefer und Lärche an."
    stavebni_rezivo:
      tramy:
        title: "Balken"
        desc_1: "Standard-Baumaterial, das am häufigsten als Dachstuhl und Dachkonstruktion für den Bau von Pergolen und Ähnlichem verwendet wird. Kanthölzer fertigen wir nach Kundenmaß an."
        desc_2: "Die maximale Schnittlänge beträgt 11 m, die Säge verarbeitet Stämme bis 110 cm Durchmesser. Bauschnittholz stellen wir aus Fichte, Kiefer und Lärche her."
      prkna:
        title: "Bretter"
        desc_1: "Baumaterial für die Herstellung von Decken, Böden, Dächern, Wandverkleidungen, Hilfskonstruktionen u. a."
        desc_2: "Bretter fertigen wir aus Fichte, Eiche, Kiefer, Lärche usw. Die maximale Schnittlänge beträgt 11 m."
      late:
        title: "Latten"
        desc_1: "Standard-Baumaterial, das am häufigsten als Dachstuhl und Dachkonstruktion für den Bau von Pergolen und Ähnlichem verwendet wird. Kanthölzer fertigen wir nach Kundenmaß an."
        desc_2: "Die maximale Schnittlänge beträgt 11 m, die Säge verarbeitet Stämme bis 110 cm Durchmesser. Bauschnittholz stellen wir aus Fichte, Kiefer und Lärche her."
      fosny:
        title: "Bohlen"
        desc_1: "Standard-Baumaterial, das für tragende Konstruktionen verwendet werden kann (Dachkonstruktionen, Pergolen, Terrassen usw.)"
        desc_2: "Die maximale Schnittlänge beträgt 11 m. Bauschnittholz stellen wir aus Fichte, Eiche, Lärche, Kiefer usw. her."
    truhlarske_rezivo:
      fosny:
        title: "Bohlen"
        desc_1: "Tischlerschnittholz ist der Grundrohstoff für die Herstellung von Leimholzplatten, die weiter zur Herstellung von Massivholzmöbeln wie Schränken, Tischen, Stühlen, Betten, Türen, Fenstern, Treppen, Musikinstrumenten usw. verwendet werden."
    okrasne_kamenivo:
      title: "Kieselsteine und Kiesel"
      desc_1: "Dekorative Ziersteine, ideal für Gärten, Wege, Teiche und Zierbeete"
      desc_2: "Erhältlich in verschiedenen Körnungen und Farbvarianten, geeignet für gestalterische Zwecke und praktische Anwendungen"
      desc_3: "Wir bieten Verpackung in Säcken oder lose Lieferung nach Kundenwunsch an."
      desc_4: "Preis ab 1 Kč pro 1 kg."
    vyrobni_zbytky:
      odkory:
        title: "Rindenreste"
        desc_1: "Hochwertige Rindenreste aus der Produktion, geeignet für weitere Werkstattnutzung, Heizen oder kleinere Tischlerarbeiten. Jede Charge enthält eine Mischung verschiedener Größen und Formen."
      stepka:
        title: "Hackschnitzel"
        desc_1: "Reine Holzhackschnitzel ohne Beimischungen, ideal für die energetische Nutzung, zum Mulchen oder zur Herstellung von Holzspanmaterialien. Zeichnet sich durch eine stabile Körnung und gleichmäßige Struktur aus."
      piliny:
        title: "Sägemehl"
        desc_1: "Feines, trockenes Sägemehl geeignet für Pellets, Briketts, Einstreu oder weitere industrielle Verarbeitung. Entsteht beim Sägen und Schleifen von Massivholz und weist eine hervorragende Rieselfähigkeit auf."

