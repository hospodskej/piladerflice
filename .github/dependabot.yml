# Dependabot: weekly pull requests that update the Rust crates and the GitHub
# Actions. Minor and patch updates arrive together in one pull request; major
# versions come one by one, as they may need changes. Security fixes come as
# soon as an advisory is published, once "Dependabot security updates" is on
# in the repository's settings (Code security).
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Prague"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
