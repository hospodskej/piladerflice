[package]
name = "site"
description = "The Pila Derflice website: pages, islands and server functions (Leptos)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
codon.workspace = true
domain.workspace = true
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Document", "Element", "HtmlElement", "HtmlDocument", "HtmlInputElement", "DomTokenList", "Storage", "Window", "Location", "Node", "NodeList", "Event", "EventTarget", "KeyboardEvent", "CssStyleDeclaration", "HtmlCollection", "DomRect", "AddEventListenerOptions"] }
js-sys = "0.3"

leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tower-sessions = { workspace = true, optional = true }
ammonia = { version = "4", optional = true }
lettre = { version = "0.11", optional = true, default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }
serde_urlencoded = { version = "0.7", optional = true }
refractory = { workspace = true, optional = true }

[build-dependencies]
codon = { workspace = true, features = ["build"] }

[features]
default = []
hydrate = ["leptos/hydrate"]
ssr = [
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "dep:leptos_axum",
  "dep:axum",
  "dep:sqlx",
  "dep:tokio",
  "dep:tracing",
  "dep:tower-sessions",
  "dep:ammonia",
  "dep:lettre",
  "dep:serde_urlencoded",
  "dep:refractory",
]

[lints]
workspace = true
