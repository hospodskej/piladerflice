<header class="site-header">
  <div class="contact-header">
    <div class="contact-item">
      <svg width="14" height="14" fill="none" stroke="#30b109" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
      <a href="tel:+420602446339" class="contact-link">+420 602 446 339</a>
    </div>
    <div class="contact-item">
      <svg width="14" height="14" fill="none" stroke="#30b109" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
      <a href="mailto:stepan.merta@seznam.cz" class="contact-link">stepan.merta@seznam.cz</a>
    </div>
  </div>
  <div class="main-nav">
    <button class="menu-toggle" id="menuToggle" aria-label="{{ t('nav.open_menu') }}">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"></path></svg>
    </button>
    <div class="logo">
      <a aria-label="{{ t('nav.domu') }}" href="{{ path('/') }}">
        <img alt="{{ t('site.name') }}" class="logo" src="{{ asset('logo-wm.webp') }}">
      </a>
    </div>
    <nav class="nav-links desktop-nav">
      {% include "shared/nav_links.html" %}
    </nav>
    <div class="header-controls">
      {% with toggle_id = "themeToggle" %}{% include "shared/theme_toggle.html" %}{% endwith %}
      <a class="btn-pill account-btn" aria-label="{{ t('nav.account') }}" href="{{ path('/prihlaseni') }}">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </a>
      {% include "shared/cart_widget.html" %}
      <div class="lang-dropdown">
        <button class="btn-pill lang-btn">
          {% if locale == "de" %}{% include "shared/flag_at.html" %}{% else %}{% include "shared/flag_cz.html" %}{% endif %}
          <span class="lang-currency">{{ "EUR" if locale == "de" else "CZK" }}</span>
          <span class="chevron">▼</span>
        </button>
        <div class="lang-dropdown-content">
          <a class="lang-option {{ 'active' if locale == 'cs' }}" data-turbo="false" href="{{ switch_cs }}">
            {% include "shared/flag_cz.html" %}<span class="lang-currency">CZK</span>
          </a>
          <a class="lang-option {{ 'active' if locale == 'de' }}" data-turbo="false" href="{{ switch_de }}">
            {% include "shared/flag_at.html" %}<span class="lang-currency">EUR</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
