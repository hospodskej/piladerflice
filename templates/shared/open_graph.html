{# The preview card shown when a link is shared (WhatsApp, Facebook, iMessage...). #}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site_name }}">
<meta property="og:title" content="{{ title or site_name }}">
<meta property="og:url" content="{{ og.url }}">
<meta property="og:locale" content="{{ og.locale }}">
{% for alternate in og.alternate_locales %}
<meta property="og:locale:alternate" content="{{ alternate }}">
{% endfor %}
{% if description %}
<meta property="og:description" content="{{ description }}">
{% endif %}
{% if og.image %}
<meta property="og:image" content="{{ og.image.url }}">
<meta property="og:image:type" content="{{ og.image.mime }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ site_name }}">
<meta name="twitter:card" content="summary_large_image">
{% else %}
<meta name="twitter:card" content="summary">
{% endif %}
