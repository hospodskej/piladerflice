{# Puts a variant into the cart. Expects `variant`; `show_qty` (default
   true) shows the quantity stepper. #}
<form class="add-to-cart-form" action="{{ path('/cart_items') }}" accept-charset="UTF-8" method="post"><input type="hidden" name="authenticity_token" value="{{ csrf_token }}">
  <input type="hidden" name="catalog_variant_id" id="catalog_variant_id" value="{{ variant.id }}">
  <div class="qty-cart-row">
    {% if show_qty is not defined or show_qty %}
      <div class="qty-stepper">
        <button type="button" class="qty-btn qty-minus" aria-label="{{ t('common.qty_decrease') }}">&minus;</button>
        <input type="number" name="quantity" id="quantity" value="1" min="1" class="qty-value" readonly="readonly">
        <button type="button" class="qty-btn qty-plus" aria-label="{{ t('common.qty_increase') }}">+</button>
      </div>
    {% else %}
      <input type="hidden" name="quantity" id="quantity" value="1">
    {% endif %}
    <button type="submit" class="btn-primary btn-cart" title="{{ t('common.add_to_cart') }}" aria-label="{{ t('common.add_to_cart') }}">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>      </svg>
</button>  </div>
</form>
